name: One-time Brevo live test

on:
  push:
    branches:
      - main

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 75
      - name: Trigger MarketVibe Brevo test
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error "https://www.marketvibe1.com/api/system/brevo-live-test?token=mv-20260728-7c3f2f9e1b6a4d8c")
          echo "$response"
          echo "$response" | grep '"ok":true'
